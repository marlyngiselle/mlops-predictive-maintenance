name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: pip install -e ".[dev]"

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest

      # The same lifecycle the jobs run, end to end, on a SQLite MLflow backend.
      - name: local lifecycle
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pdm demo --workdir .local

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-summary
          path: |
            .local/demo_summary.json
            .local/drift_*.json
          retention-days: 14

  bundle:
    name: bundle and serving YAML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: parse every YAML file
        run: |
          pip install pyyaml
          python - <<'EOF'
          import pathlib, sys, yaml
          files = [p for d in ("pipelines", "serving", "monitoring") for p in pathlib.Path(d).rglob("*.yml")]
          for f in files:
              yaml.safe_load(f.read_text())
              print("ok", f)
          sys.exit(0 if files else 1)
          EOF

  terraform:
    name: terraform (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: [azureml, unity-catalog]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: init
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.60.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  deploy:
    name: deploy bundle (prod)
    # Off by default. To enable, set the repository variable BUNDLE_DEPLOY=true and the
    # DATABRICKS_HOST, DATABRICKS_CLIENT_ID and DATABRICKS_RELEASE_SP secrets. The client is a
    # service principal with a GitHub OIDC federation policy, so no long-lived token exists.
    # The "production" environment carries the required reviewers.
    if: ${{ vars.BUNDLE_DEPLOY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [python, bundle, terraform]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: pipelines
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1

      - name: validate
        run: databricks bundle validate --target prod --var="service_principal=${{ secrets.DATABRICKS_RELEASE_SP }}"

      - name: deploy
        run: databricks bundle deploy --target prod --var="service_principal=${{ secrets.DATABRICKS_RELEASE_SP }}"

      - name: publish drift thresholds
        run: databricks fs cp ../monitoring/thresholds.yml dbfs:/Volumes/ml_prod/pdm/data/config/thresholds.yml --overwrite
