$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
# Blue/green: create "green" with the new champion at 0 percent traffic, smoke test it with
# --deployment-name green, then move traffic. See serving/README.md.
#
# az ml online-deployment create --file serving/azureml/deployment.yml --all-traffic
name: blue
endpoint_name: pdm-rul
# Registered from the Unity Catalog champion by the release step (serving/README.md).
model: azureml:pdm-rul:1
code_configuration:
  code: .
  scoring_script: score.py
environment:
  name: pdm-rul-inference
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: environment/conda.yml
instance_type: Standard_DS3_v2
instance_count: 2
# Workspace managed network egress rules apply; the deployment cannot reach the internet.
egress_public_network_access: disabled
environment_variables:
  MAINTENANCE_THRESHOLD_CYCLES: "30"
request_settings:
  request_timeout_ms: 5000
  max_concurrent_requests_per_instance: 4
liveness_probe:
  initial_delay: 30
  period: 10
readiness_probe:
  initial_delay: 30
  period: 10
data_collector:
  collections:
    model_inputs:
      enabled: "true"
    model_outputs:
      enabled: "true"
