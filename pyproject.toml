[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm-rul"
version = "0.1.0"
description = "Remaining useful life prediction for industrial assets, from notebook to governed production."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Giselle Da Costa" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "mlflow-skinny>=3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The local MLflow backend is a SQLite file, which needs SQLAlchemy and Alembic.
local = ["sqlalchemy>=2.0", "alembic>=1.13"]
dev = [
  "pdm-rul[local]",
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
]

[project.scripts]
pdm = "pdm.cli:main"

[tool.setuptools.package-data]
pdm = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "serving"]
extend-exclude = [".local", "mlruns", "pipelines/dist", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR0915", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["pdm"]

[tool.mypy]
python_version = "3.11"
files = ["src", "serving/azureml"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "mlflow.*", "pyarrow.*", "joblib.*"]
ignore_missing_imports = true
